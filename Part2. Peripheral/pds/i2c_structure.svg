<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">

  <!-- background -->
  <rect width="760" height="230" fill="#fafafa" rx="4" stroke="#e0e0e0" stroke-width="1"/>

  <!-- title -->
  <text x="380" y="20" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    I2C Bus Structure
  </text>

  <!-- VCC rail (dashed red) -->
  <line x1="50" y1="42" x2="730" y2="42" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="46" y="46" text-anchor="end"
        font-family="monospace" font-size="12" font-weight="bold" fill="#c0392b">VCC</text>

  <!-- Pull-up Rp for SDA (at x=196) -->
  <line x1="196" y1="42" x2="196" y2="76" stroke="#95a5a6" stroke-width="1.5"/>
  <rect x="186" y="76" width="20" height="26" rx="2" fill="#fef9e7" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="196" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Rp</text>
  <line x1="196" y1="102" x2="196" y2="140" stroke="#95a5a6" stroke-width="1.5"/>

  <!-- Pull-up Rp for SCL (at x=222) -->
  <line x1="222" y1="42" x2="222" y2="76" stroke="#95a5a6" stroke-width="1.5"/>
  <rect x="212" y="76" width="20" height="26" rx="2" fill="#fef9e7" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="222" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Rp</text>
  <line x1="222" y1="102" x2="222" y2="185" stroke="#95a5a6" stroke-width="1.5"/>

  <!-- SDA bus -->
  <line x1="50" y1="140" x2="730" y2="140" stroke="#2980b9" stroke-width="3"/>
  <text x="46" y="144" text-anchor="end"
        font-family="monospace" font-size="13" font-weight="bold" fill="#2980b9">SDA</text>

  <!-- SCL bus -->
  <line x1="50" y1="185" x2="730" y2="185" stroke="#27ae60" stroke-width="3"/>
  <text x="46" y="189" text-anchor="end"
        font-family="monospace" font-size="13" font-weight="bold" fill="#27ae60">SCL</text>

  <!-- GND rail (dashed) -->
  <line x1="50" y1="218" x2="730" y2="218" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="46" y="222" text-anchor="end"
        font-family="monospace" font-size="12" font-weight="bold" fill="#555">GND</text>

  <!-- Controller (Master) -->
  <rect x="53" y="56" width="108" height="66" rx="6" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="107" y="79" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#154360">Controller</text>
  <text x="107" y="95" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="10" fill="#154360">(Master)</text>
  <text x="107" y="110" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" fill="#5d6d7e">Generates SCL</text>
  <!-- SDA connection -->
  <line x1="88" y1="122" x2="88" y2="140" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="88" cy="140" r="4" fill="#2980b9"/>
  <!-- SCL connection -->
  <line x1="112" y1="122" x2="112" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="112" cy="185" r="4" fill="#27ae60"/>

  <!-- Target A (addr 0x27, 캐릭터 LCD) -->
  <rect x="295" y="56" width="122" height="66" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="356" y="79" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Target A</text>
  <text x="356" y="95" text-anchor="middle"
        font-family="monospace" font-size="10" fill="#1e8449">addr: 0x27</text>
  <text x="356" y="111" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" fill="#5d6d7e">캐릭터 LCD</text>
  <!-- SDA connection -->
  <line x1="344" y1="122" x2="344" y2="140" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="344" cy="140" r="4" fill="#2980b9"/>
  <!-- SCL connection -->
  <line x1="368" y1="122" x2="368" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="368" cy="185" r="4" fill="#27ae60"/>

  <!-- Target B (addr 0x68, IMU MPU-6050) -->
  <rect x="463" y="56" width="122" height="66" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="524" y="79" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Target B</text>
  <text x="524" y="95" text-anchor="middle"
        font-family="monospace" font-size="10" fill="#1e8449">addr: 0x68</text>
  <text x="524" y="111" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" fill="#5d6d7e">IMU (MPU-6050)</text>
  <!-- SDA connection -->
  <line x1="512" y1="122" x2="512" y2="140" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="512" cy="140" r="4" fill="#2980b9"/>
  <!-- SCL connection -->
  <line x1="536" y1="122" x2="536" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="536" cy="185" r="4" fill="#27ae60"/>

  <!-- more targets ellipsis -->
  <text x="660" y="92" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" fill="#bdc3c7">&#183;&#183;&#183;</text>
  <text x="660" y="112" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="10" fill="#aaa">more targets</text>

</svg>

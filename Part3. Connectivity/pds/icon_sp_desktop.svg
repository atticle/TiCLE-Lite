<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- desktop background -->
  <rect x="1" y="2" width="22" height="16" rx="2" fill="#6AB0F5" stroke="#2D80D2" stroke-width="1"/>
  <!-- taskbar -->
  <rect x="1" y="14" width="22" height="4" fill="#2D80D2"/>
  <!-- start button -->
  <rect x="2" y="15" width="5" height="2" rx="0.5" fill="#5BC85B"/>
  <!-- folder icon on desktop -->
  <rect x="9" y="5" width="6" height="5" rx="1" fill="#F5C842" stroke="#C8A020" stroke-width="0.8"/>
  <rect x="9" y="4" width="3" height="1.5" rx="0.5" fill="#F5C842" stroke="#C8A020" stroke-width="0.8"/>
  <!-- stand neck -->
  <rect x="10" y="18" width="4" height="2" fill="#888"/>
  <!-- stand base -->
  <rect x="7" y="20" width="10" height="2" rx="1" fill="#888"/>
</svg>
